name: Build APK

# Produces an installable APK.
#
# A release asset is a plain .apk link you can tap on the phone you want to install it on,
# which a workflow artifact — a zip behind an authenticated URL — is not. But this
# repository is public, and both variants are signed with the debug keystore, so handing
# strangers a debug-signed build is not something to do by accident. Tags publish, because
# that is what a tag is for; a manual run only publishes if it is asked to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug (installable straight away) or release (minified)'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]
      publish:
        description: 'Also attach the APK to a public GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        id: assemble
        run: |
          chmod +x ./gradlew
          variant='${{ github.event.inputs.variant || 'debug' }}'
          if [ "$variant" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
            apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            ./gradlew assembleDebug --stacktrace
            apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          # Both variants are signed with the debug keystore, so both install on a normal
          # phone with "install unknown apps" enabled. Neither is suitable for Play.
          cp "$apk" "sonoritmo-$variant.apk"
          echo "path=sonoritmo-$variant.apk" >> "$GITHUB_OUTPUT"
          echo "### APK: $(du -h "sonoritmo-$variant.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonoritmo-apk
          path: ${{ steps.assemble.outputs.path }}

      - name: Publish as a release asset
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "SonoRitmo $tag" \
              --notes "Installable APK built from ${{ github.sha }}. Signed with the debug key: enable \"install unknown apps\" on your phone. Not a Play-ready build." \
              ${{ github.ref_type == 'tag' && ' ' || '--prerelease' }}
          fi
          gh release upload "$tag" "${{ steps.assemble.outputs.path }}" --clobber
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/${{ steps.assemble.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
