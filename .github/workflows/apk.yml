name: Build APK

# Produces an installable APK.
#
# A release asset is a plain .apk link you can tap on the phone you want to install it on,
# which a workflow artifact — a zip behind an authenticated URL — is not. But this
# repository is public, and both variants are signed with the debug keystore, so handing
# strangers a debug-signed build is not something to do by accident. Tags publish, because
# that is what a tag is for; a manual run only publishes if it is asked to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        # release by default: the debug build is marked debuggable, which Play Protect
        # treats as a harmful app and refuses to install without a fight. The release build
        # is minified and not debuggable, so it installs like any other sideloaded app.
        description: 'release (installable, minified) or debug (debuggable, Play Protect blocks it)'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
      publish:
        description: 'Also attach the APK to a public GitHub Release'
        required: false
        default: false
        type: boolean
      bundle:
        # Play has not accepted APK uploads since 2021. The bundle is never attached to a
        # public release: it is not installable on a phone, and the only thing that can do
        # anything with it is the Play Console.
        description: 'Also build an Android App Bundle (.aab) for the Play Console'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Absent on forks and on pull requests from them, where secrets are withheld. The
      # build falls back to the debug key in that case instead of failing.
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-keystore.p12
            echo "Signing with the release key."
          else
            echo "::warning::No signing secret available; falling back to the debug key."
          fi

      - name: Assemble
        id: assemble
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          variant='${{ github.event.inputs.variant || 'release' }}'
          if [ "$variant" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
            apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            ./gradlew assembleDebug --stacktrace
            apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          # The release variant carries the project's own signing key; the debug variant is
          # always signed with the shared debug key and is also marked debuggable, which is
          # what Play Protect objects to. Neither is a Play-ready build.
          cp "$apk" "sonoritmo-$variant.apk"
          echo "path=sonoritmo-$variant.apk" >> "$GITHUB_OUTPUT"
          echo "### APK: $(du -h "sonoritmo-$variant.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # Facts rather than assumptions: which certificate actually signed the file, and
      # whether the manifest ended up debuggable. Both are invisible in the APK's size and
      # both decide how the phone greets the install.
      - name: Report what was signed
        run: |
          sdk="$ANDROID_HOME/build-tools"
          tools=$(ls -1 "$sdk" | sort -V | tail -1)
          "$sdk/$tools/apksigner" verify --print-certs -v "${{ steps.assemble.outputs.path }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # aapt2 prints application-debuggable only when the flag is set, so its absence
          # from this output is the result we want.
          "$sdk/$tools/aapt2" dump badging "${{ steps.assemble.outputs.path }}" \
            | grep -E "^(package|application-debuggable)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the Play bundle
        if: inputs.bundle
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace
          aab=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$aab" sonoritmo-release.aab
          echo "### Bundle: $(du -h sonoritmo-release.aab | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonoritmo-apk
          path: ${{ steps.assemble.outputs.path }}

      - name: Upload the Play bundle
        if: inputs.bundle
        uses: actions/upload-artifact@v4
        with:
          name: sonoritmo-bundle
          path: sonoritmo-release.aab

      - name: Publish as a release asset
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "SonoRitmo $tag" \
              --notes "Installable APK built from ${{ github.sha }}. Signed with the debug key: enable \"install unknown apps\" on your phone. Not a Play-ready build." \
              ${{ github.ref_type == 'tag' && ' ' || '--prerelease' }}
          fi
          gh release upload "$tag" "${{ steps.assemble.outputs.path }}" --clobber
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/${{ steps.assemble.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
